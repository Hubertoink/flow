name: flow-team
services:
  app:
    image: ${FLOW_IMAGE:-flow-team:local}
    environment:
      NODE_ENV: production
      FLOW_HOST: 0.0.0.0
      FLOW_PORT: 8080
      FLOW_URL: ${FLOW_URL:?Public HTTPS URL required}
      FLOW_AUTH_SECRET: ${FLOW_AUTH_SECRET:?Auth secret required}
      FLOW_SETUP_TOKEN: ${FLOW_SETUP_TOKEN:?Setup token required}
      FLOW_TRUST_PROXY: ${FLOW_TRUST_PROXY:-1}
      DATABASE_URL: postgresql://flow:${FLOW_DB_PASSWORD:?Database password required}@database:5432/flow
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Flow! <flow@example.org>}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flow
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: ${FLOW_DB_PASSWORD:?Database password required}
    volumes:
      - flow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backup:
    image: ${FLOW_BACKUP_IMAGE:-flow-team-backup:local}
    environment:
      PGHOST: database
      PGUSER: flow
      PGDATABASE: flow
      PGPASSWORD: ${FLOW_DB_PASSWORD:?Database password required}
    volumes:
      - flow_backups:/backups
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  flow_data:
  flow_backups:
