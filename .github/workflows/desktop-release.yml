name: Desktop distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run check
      - run: npm test
      - run: npm run test:desktop
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check update metadata
        shell: bash
        run: |
          grep -F "path: Flow-Setup-" release/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run check
      - run: npm test
      - run: xvfb-run --auto-servernum npm run test:desktop
      - run: npx electron-builder --linux AppImage --x64 --publish never
      - run: node package-linux.mjs
      - name: Check Linux update metadata
        run: |
          grep -F "path: Flow-" release/latest-linux.yml
      - name: Check portable Linux package
        run: |
          tar -tzf release/Flow-*-x86_64-linux.tar.gz | grep -Fx './flow-jugendplan'
          tar -tzf release/Flow-*-x86_64-linux.tar.gz | grep -Fx './resources/app.asar'
          test -x release/linux-unpacked/flow-jugendplan
          cd release
          sha256sum -c SHA256SUMS
      - name: Validate AUR recipe on Arch Linux
        run: |
          cp release/Flow-*-x86_64-linux.tar.gz release/aur/
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "$PWD/release/aur:/work" archlinux:base-devel bash -euc '
            useradd -m builder
            chown -R builder:builder /work
            cd /work
            runuser -u builder -- makepkg --nodeps --force
            runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
            tar -czf /work/Flow-AUR.tar.gz PKGBUILD .SRCINFO
            chown -R "$HOST_UID:$HOST_GID" /work
          '
          mv release/aur/Flow-AUR.tar.gz release/
          cd release
          sha256sum Flow-AUR.tar.gz >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Linux
          path: |
            release/*.AppImage
            release/*-x86_64-linux.tar.gz
            release/SHA256SUMS
            release/Flow-AUR.tar.gz
            release/latest-linux.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Flow-*
          merge-multiple: true
          path: release
      - name: Publish desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --title "Flow! $TAG" --generate-notes --verify-tag
